site_name: "The Brighton Watch"
site_description: "superdean.com - Horology and Watchmaking"
site_url: "https://superdean.com"

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Current Builds: builds.md
  - Completed Builds: complete.md
  - For Collectors: collector.md
  - Advanced Techniques: watchmaker.md
  - Tools: tools.md
  - Reviews: reviews.md
  - Marriage Watches: marriage.md
  - Molniya Special: molniya.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

plugins:
  - search
  - glightbox

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://superdean.com